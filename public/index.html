<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lili Market - Expendedora Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-display { font-family: 'Orbitron', sans-serif; }
        .vending-grid { background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #182234 10px, #182234 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlOxVzPhjz1fhz0n5NGroAj8H7w28SEz8",
            authDomain: "markets-bc527.firebaseapp.com",
            projectId: "markets-bc527",
            storageBucket: "markets-bc527.firebasestorage.app",
            messagingSenderId: "9908715735",
            appId: "1:9908715735:web:ebe16ec9c64306184cb092"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = app.firestore();

        // --- UTILIDADES ---
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_SIZE = 200;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        const sendTelegramMessage = async (order) => {
            const text = `🛒 NUEVO PEDIDO - LILI MARKET (Cód: ${order.code})\n\n👤 Cliente: ${order.client}\n📍 Ubicación: ${order.location}\n📦 Pedido: ${order.items}\n💰 Total: S/ ${order.total.toFixed(2)}\n\n✅ Comprobante subido en la plataforma.`;
            try {
                await fetch('/api/send-telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
            } catch (e) { console.error("Error Telegram:", e); }
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [route, setRoute] = useState(window.location.hash);
            const [products, setProducts] = useState([]);
            const [clientConfig, setClientConfig] = useState({ yapeNumber: '', yapeQR: '' });
            const [superadminConfig, setSuperadminConfig] = useState({ yapeNumber: '', yapeQR: '' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.addEventListener('hashchange', () => setRoute(window.location.hash));
                
                const unsubProducts = db.collection('products').onSnapshot(snapshot => {
                    setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setLoading(false);
                });

                db.collection('config').doc('client_payment').onSnapshot(doc => {
                    if (doc.exists) setClientConfig(doc.data());
                });

                db.collection('config').doc('superadmin_payment').onSnapshot(doc => {
                    if (doc.exists) setSuperadminConfig(doc.data());
                });

                db.collection('products').get().then(snapshot => {
                    if(snapshot.empty) {
                        const initialData = [
                            { code: "A1", name: "Coca Cola 1.5L", price: 7.00, img: "https://images.unsplash.com/photo-1554866585-cd94860890b7?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 10 },
                            { code: "A2", name: "Inka Chips", price: 3.50, img: "https://images.unsplash.com/photo-1613919113640-25732ec5e61f?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 15 },
                            { code: "B1", name: "Galleta Oreo", price: 2.00, img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 20 },
                            { code: "B2", name: "Chocolate", price: 2.50, img: "https://images.unsplash.com/photo-1623660053975-cf75a8be0908?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 5 },
                            { code: "C1", name: "Agua 500ml", price: 1.50, img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 30 },
                            { code: "C2", name: "Red Bull", price: 8.00, img: "https://images.unsplash.com/photo-1622597467836-f3285f2131b8?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", stock: 8 }
                        ];
                        initialData.forEach(p => db.collection('products').add(p));
                    }
                });

                return () => unsubProducts();
            }, []);

            const goAdmin = () => { window.location.hash = '#admin'; setRoute('#admin'); };
            const goSuperAdmin = () => { window.location.hash = '#superadmin'; setRoute('#superadmin'); };
            const goClient = () => { window.location.hash = ''; setRoute(''); };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-green-400 font-display">CARGANDO MÁQUINA...</div>;

            if (route === '#superadmin') return <SuperAdminApp onBackClick={goClient} superadminConfig={superadminConfig} />;
            if (route === '#admin') return <AdminApp onBackClick={goClient} products={products} clientConfig={clientConfig} superadminConfig={superadminConfig} />;
            
            return <ClientApp onAdminClick={goAdmin} products={products} clientConfig={clientConfig} />;
        }

        // --- VISTA DEL CLIENTE ---
        function ClientApp({ onAdminClick, products, clientConfig }) {
            const [cart, setCart] = useState([]);
            const [view, setView] = useState('home');
            const [clientName, setClientName] = useState('');
            const [location, setLocation] = useState('');
            const [receipt, setReceipt] = useState(null);
            const [error, setError] = useState('');
            const [loadingOrder, setLoadingOrder] = useState(false);
            const [lastOrderInfo, setLastOrderInfo] = useState(null);

            const availableProducts = products.filter(p => p.stock > 0);

            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing && existing.qty >= product.stock) return;
                if (existing) setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                else setCart([...cart, { ...product, qty: 1 }]);
            };

            const decreaseQty = (id) => {
                const existing = cart.find(item => item.id === id);
                if (existing.qty === 1) setCart(cart.filter(item => item.id !== id));
                else setCart(cart.map(item => item.id === id ? { ...item, qty: item.qty - 1 } : item));
            };

            const removeItem = (id) => setCart(cart.filter(item => item.id !== id));
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            const handleReceiptFile = (e) => {
                const file = e.target.files[0];
                if(file) compressImage(file, (src) => setReceipt(src));
            };

            const copyYapeNumber = () => {
                if(clientConfig.yapeNumber) {
                    navigator.clipboard.writeText(clientConfig.yapeNumber.replace(/\s/g, ''));
                    alert("¡Número copiado! Ábrelo en tu app de Yape.");
                }
            };

            const confirmOrder = async () => {
                setError('');
                if(!clientName || !location || !receipt) {
                    setError("⚠️ Falta tu nombre, la ubicación o el comprobante de Yape.");
                    return;
                }
                setLoadingOrder(true);
                try {
                    const orderCode = "LM-" + Date.now().toString().slice(-6);
                    const orderData = {
                        code: orderCode,
                        client: clientName,
                        items: cart.map(p => `${p.name} (x${p.qty})`).join(", "),
                        total: totalPrice,
                        status: "Recibido",
                        location: location,
                        receipt: receipt,
                        createdAt: Date.now()
                    };
                    
                    await db.collection('orders').add(orderData);
                    await sendTelegramMessage(orderData);

                    const batch = db.batch();
                    cart.forEach(item => {
                        const productRef = db.collection('products').doc(item.id);
                        batch.update(productRef, { stock: item.stock - item.qty });
                    });
                    await batch.commit();
                    
                    setLastOrderInfo({ code: orderCode, summary: orderData.items, total: totalPrice });
                    setCart([]); setClientName(''); setLocation(''); setReceipt(null);
                    setView('success');
                } catch (err) {
                    console.error(err);
                    setError("❌ Error al guardar el pedido. Intenta nuevamente.");
                } finally {
                    setLoadingOrder(false);
                }
            };

            if(view === 'success' && lastOrderInfo) {
                return (
                    <div className="max-w-md mx-auto p-8 text-center bg-slate-900 min-h-screen flex flex-col justify-center">
                        <h2 className="text-3xl font-display font-bold text-green-400 mb-2">¡DESPACHADO! 🛒</h2>
                        <p className="text-slate-300 mb-6">Lili Market recibió tu pedido.</p>
                        
                        <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 mb-6 text-left">
                            <p className="text-center text-green-400 font-display text-xl font-bold mb-4">CÓDIGO: {lastOrderInfo.code}</p>
                            <div className="border-t border-slate-700 pt-3 space-y-1">
                                <p className="text-sm text-slate-400">Resumen del pedido:</p>
                                <p className="text-white text-sm">{lastOrderInfo.summary}</p>
                                <p className="text-green-400 font-bold text-lg mt-2">Total: S/ {lastOrderInfo.total.toFixed(2)}</p>
                            </div>
                        </div>

                        <p className="text-slate-500 text-xs mb-6">📸 Toma una captura de pantalla a este comprobante por si acaso.</p>
                        
                        <button onClick={() => { setView('home'); setLastOrderInfo(null); }} className="bg-green-500 text-slate-900 py-3 px-8 rounded-xl font-bold hover:bg-green-400 mb-2">Volver a la Máquina</button>
                        <button onClick={onAdminClick} className="text-sm text-slate-500 underline">Ver Panel Admin</button>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-slate-800 min-h-screen relative pb-28 border-x border-slate-700">
                    <header className="p-4 flex justify-between items-center bg-black border-b-4 border-green-500 sticky top-0 z-20">
                        <div>
                            <h1 className="text-xl font-display font-bold tracking-wider text-green-400">LILI MARKET</h1>
                            <p className="text-[10px] text-slate-500 tracking-widest">MAQUINA EXPENDEDORA 24/7</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={onAdminClick} className="text-slate-600 text-xs hover:text-slate-400">⚙️ Admin</button>
                            <div className="bg-green-900/40 border border-green-500 px-3 py-1 rounded-lg flex items-center gap-2">
                                <span className="text-green-400 text-sm font-bold">🛒 {totalQty}</span>
                            </div>
                        </div>
                    </header>

                    <div className="p-4 vending-grid min-h-[calc(100vh-100px)]">
                        {availableProducts.length === 0 ? (
                            <div className="text-center text-slate-500 mt-20 font-display">MÁQUINA VACÍA</div>
                        ) : (
                            <div className="grid grid-cols-2 gap-4">
                                {availableProducts.map(p => {
                                    const itemInCart = cart.find(item => item.id === p.id);
                                    return (
                                        <div key={p.id} className={`bg-slate-700 rounded-xl overflow-hidden border-2 ${itemInCart ? 'border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.3)]' : 'border-slate-600'}`}>
                                            <div className="relative">
                                                <img src={p.img} alt={p.name} className="w-full aspect-square object-cover" />
                                                <span className="absolute top-1 left-1 bg-black/70 text-green-400 text-[10px] font-display px-1.5 py-0.5 rounded">{p.code}</span>
                                            </div>
                                            <div className="p-2">
                                                <h3 className="font-bold text-xs text-white h-8 overflow-hidden">{p.name}</h3>
                                                <div className="flex justify-between items-center mt-1">
                                                    <span className="text-green-400 font-display font-bold text-sm">S/ {p.price.toFixed(2)}</span>
                                                </div>
                                                {itemInCart ? (
                                                    <div className="flex items-center justify-between mt-2 bg-black/30 rounded-lg p-1">
                                                        <button onClick={() => decreaseQty(p.id)} disabled={loadingOrder} className="text-white bg-red-500 w-6 h-6 rounded font-bold flex items-center justify-center disabled:opacity-30">-</button>
                                                        <span className="text-white font-bold text-sm">{itemInCart.qty}</span>
                                                        <button onClick={() => addToCart(p)} disabled={itemInCart.qty >= p.stock || loadingOrder} className="text-white bg-green-500 w-6 h-6 rounded font-bold flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(p)} disabled={loadingOrder} className="w-full mt-2 bg-slate-900 text-green-400 text-xs py-1.5 rounded-lg font-bold border border-green-500/30 hover:bg-slate-950 disabled:opacity-30">+ Agregar</button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {view === 'checkout' && (
                        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-end justify-center z-50">
                            <div className="bg-slate-800 w-full max-w-md rounded-t-2xl p-6 max-h-[90vh] overflow-y-auto border-t-2 border-green-500">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-display font-bold text-green-400">TU CARRITO</h2>
                                    <button onClick={() => setView('home')} className="text-slate-400 text-2xl">&times;</button>
                                </div>
                                
                                <div className="bg-black/30 rounded-xl p-3 mb-4 border border-slate-700">
                                    {cart.length === 0 ? ( <p className="text-slate-500 text-center text-sm py-4">Carrito vacío</p> ) : (
                                        cart.map((item) => (
                                            <div key={item.id} className="flex items-center gap-2 py-2 border-b border-slate-700 last:border-0">
                                                <img src={item.img} className="w-10 h-10 rounded object-cover" alt={item.name} />
                                                <div className="flex-1">
                                                    <p className="text-white text-sm font-semibold">{item.name}</p>
                                                    <p className="text-green-400 text-xs">S/ {item.price.toFixed(2)} c/u</p>
                                                </div>
                                                <div className="flex items-center gap-2 bg-slate-900 rounded-lg p-1">
                                                    <button onClick={() => decreaseQty(item.id)} disabled={loadingOrder} className="text-white bg-red-500 w-5 h-5 rounded text-xs font-bold flex items-center justify-center disabled:opacity-30">-</button>
                                                    <span className="text-white text-sm font-bold">{item.qty}</span>
                                                    <button onClick={() => addToCart(item)} disabled={item.qty >= item.stock || loadingOrder} className="text-white bg-green-500 w-5 h-5 rounded text-xs font-bold flex items-center justify-center disabled:opacity-30">+</button>
                                                </div>
                                                <button onClick={() => removeItem(item.id)} disabled={loadingOrder} className="text-red-400 hover:text-red-300 ml-1 disabled:opacity-30">🗑️</button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <>
                                        <div className="flex justify-between font-display font-bold text-green-400 mb-4 text-lg">
                                            <span>TOTAL</span><span>S/ {totalPrice.toFixed(2)}</span>
                                        </div>
                                        {error && <div className="bg-red-900/50 border border-red-500 text-red-300 text-sm p-2 rounded mb-4">{error}</div>}

                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-400 mb-1">1. Paga a este Yape</label>
                                            <div className="bg-slate-900 p-3 rounded-xl flex flex-col items-center border border-slate-700">
                                                {clientConfig.yapeQR ? (
                                                    <img src={clientConfig.yapeQR} alt="QR Yape" className="w-32 h-32 mb-2 rounded object-cover" />
                                                ) : (
                                                    <p className="text-slate-500 text-xs my-4">El vendedor no ha configurado su QR.</p>
                                                )}
                                                {clientConfig.yapeNumber && (
                                                    <>
                                                        <p className="text-xs text-slate-400 mb-1">Toca para copiar el número:</p>
                                                        <button onClick={copyYapeNumber} className="bg-slate-700 text-green-400 text-sm font-bold px-3 py-2 rounded-lg hover:bg-slate-600 w-full flex items-center justify-center gap-2">
                                                            <span>{clientConfig.yapeNumber}</span> 📋
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-400 mb-1">2. Sube tu comprobante</label>
                                            <input type="file" accept="image/*" onChange={handleReceiptFile} className="w-full text-sm p-2 bg-slate-900 rounded-lg border border-slate-700 text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-green-900/50 file:text-green-400" />
                                            {receipt && <img src={receipt} className="w-16 h-16 object-cover mt-2 rounded-md" alt="Comprobante" />}
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 mb-6">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-400 mb-1">3. Tu Nombre</label>
                                                <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Ej: Carlos" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-400 mb-1">4. Ubicación</label>
                                                <input type="text" value={location} onChange={(e) => setLocation(e.target.value)} placeholder="Ej: Piso 3" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm" />
                                            </div>
                                        </div>
                                        <button onClick={confirmOrder} disabled={loadingOrder} className="w-full bg-green-500 text-slate-900 py-3 rounded-xl font-display font-bold text-md hover:bg-green-400 disabled:opacity-50 disabled:cursor-not-allowed">
                                            {loadingOrder ? 'Procesando...' : 'CONFIRMAR PEDIDO'}
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {cart.length > 0 && view !== 'checkout' && (
                        <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-black/90 backdrop-blur border-t border-green-500/30">
                            <button onClick={() => setView('checkout')} className="w-full bg-green-500 text-slate-900 py-3 rounded-xl font-display font-bold text-md flex justify-between items-center px-6 hover:bg-green-400">
                                <span>PAGAR AHORA</span>
                                <span>S/ {totalPrice.toFixed(2)}</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // --- VISTA ADMIN (LILI) ---
        function AdminApp({ onBackClick, products, clientConfig, superadminConfig }) {
            const [orders, setOrders] = useState([]);
            const [payments, setPayments] = useState([]);
            const [tab, setTab] = useState('pedidos');
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');
            const [modalReceipt, setModalReceipt] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            const [commReceipt, setCommReceipt] = useState(null);
            const [commAmount, setCommAmount] = useState('');
            const [commDate, setCommDate] = useState('');
            const [commRef, setCommRef] = useState('');
            const [commError, setCommError] = useState('');

            const [editYapeNumber, setEditYapeNumber] = useState(clientConfig.yapeNumber || '');
            const [editYapeQR, setEditYapeQR] = useState(clientConfig.yapeQR || null);

            useEffect(() => {
                setEditYapeNumber(clientConfig.yapeNumber || '');
                setEditYapeQR(clientConfig.yapeQR || null);
            }, [clientConfig]);

            useEffect(() => {
                if (auth) {
                    const unsubOrders = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                        setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    const unsubPayments = db.collection('commission_payments').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                        setPayments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    return () => { unsubOrders(); unsubPayments(); };
                }
            }, [auth]);

            const login = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pass })
                    });
                    const data = await res.json();
                    if (data.success && data.role === 'admin') { 
                        setAuth(true); setError(''); 
                    } else {
                        setError('Contraseña incorrecta');
                    }
                } catch (err) {
                    setError('Error de conexión');
                }
            };

            const updateOrderStatus = async (id, status) => { await db.collection('orders').doc(id).update({ status }); };
            const addNewProduct = async () => { await db.collection('products').add({ code: "N", name: "Nuevo", price: 1.00, img: "https://via.placeholder.com/150", stock: 0 }); };
            const updateProductField = async (id, field, value) => { await db.collection('products').doc(id).update({ [field]: value }); };
            const deleteProduct = async (id) => { if(confirm("¿Eliminar?")) await db.collection('products').doc(id).delete(); };
            const handleProductImage = (id, e) => {
                const file = e.target.files[0];
                if (file) compressImage(file, (src) => updateProductField(id, 'img', src));
            };

            const handleCommFile = (e) => {
                const file = e.target.files[0];
                if(file) compressImage(file, (src) => setCommReceipt(src));
            };

            const submitPayment = async (e) => {
                e.preventDefault();
                if(!commReceipt || !commAmount || !commDate) { setCommError("Sube el comprobante, ingresa el monto y la fecha."); return; }
                try {
                    await db.collection('commission_payments').add({
                        receipt: commReceipt,
                        amountPaid: parseFloat(commAmount),
                        paymentDate: commDate,
                        reference: commRef,
                        status: "Pendiente",
                        createdAt: Date.now()
                    });
                    setCommReceipt(null); setCommAmount(''); setCommDate(''); setCommRef(''); setCommError('');
                    alert("Comprobante enviado al administrador de la plataforma.");
                } catch(err) { console.error(err); setCommError("Error al subir."); }
            };

            const handleClientQRFile = (e) => {
                const file = e.target.files[0];
                if (file) compressImage(file, (src) => setEditYapeQR(src));

                            <img src={modalReceipt} className="max-w-full max-h-full rounded-lg" alt="Comprobante" />
                            <button className="absolute top-4 right-4 text-white text-4xl">&times;</button>
                        </div>
                    )}
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-6 border-b border-red-500 pb-4">
                            <div>
                                <h2 className="text-xl font-display font-bold text-red-500">SUPERADMIN DASHBOARD</h2>
                                <p className="text-sm text-slate-500">Control de Plataforma SaaS</p>
                            </div>
                            <button onClick={onBackClick} className="text-sm text-slate-400 hover:text-white border border-slate-700 px-3 py-1 rounded">← Salir</button>
                        </div>

                        <div className="flex gap-2 mb-6">
                            <button onClick={() => setTab('dashboard')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'dashboard' ? 'bg-red-500 text-white' : 'bg-slate-900 text-slate-400'}`}>Resumen</button>
                            <button onClick={() => setTab('pagos')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'pagos' ? 'bg-red-500 text-white' : 'bg-slate-900 text-slate-400'}`}>Aprobación de Pagos</button>
                            <button onClick={() => setTab('config')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'config' ? 'bg-red-500 text-white' : 'bg-slate-900 text-slate-400'}`}>Config. Pagos</button>
                        </div>

                        {tab === 'dashboard' && (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                        <p className="text-slate-400 text-xs">Ventas Históricas (Plataforma)</p>
                                        <p className="text-2xl font-bold text-white">S/ {totalSalesAllTime.toFixed(2)}</p>
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                        <p className="text-slate-400 text-xs">Comisión Total Generada</p>
                                        <p className="text-2xl font-bold text-white">S/ {totalCommissionAllTime.toFixed(2)}</p>
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-xl border border-red-500">
                                        <p className="text-slate-400 text-xs">Deuda Actual de Lili</p>
                                        <p className="text-2xl font-bold text-white">S/ {currentDebt.toFixed(2)}</p>
                                        <p className="text-green-400 text-sm mt-1">Total Cobrado: S/ {totalPaid.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    <div className="bg-slate-900 p-4 rounded-xl border border-yellow-500/30 flex flex-col items-center justify-center text-center">
                                        <p className="text-yellow-400 text-sm font-bold mb-2">⚠️ Resetear Tienda (Admin)</p>
                                        <p className="text-slate-400 text-xs mb-3">Borra todos los pedidos y pagos de Lili. Útil para empezar a operar limpio.</p>
                                        <button onClick={resetAdminPlatform} className="bg-yellow-600 text-white px-4 py-2 rounded font-bold text-sm hover:bg-yellow-700 w-full">Resetear Panel de Lili</button>
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-xl border border-red-500 flex flex-col items-center justify-center text-center">
                                        <p className="text-red-500 text-sm font-bold mb-2">🚨 Resetear Plataforma (Global)</p>
                                        <p className="text-slate-400 text-xs mb-3">Borra TODO (Pedidos, Pagos, Productos). La app queda como recién instalada.</p>
                                        <button onClick={resetGlobalPlatform} className="bg-red-800 text-white px-4 py-2 rounded font-bold text-sm hover:bg-red-900 w-full">Factory Reset (Borrar Todo)</button>
                                    </div>
                                </div>

                                <input 
                                    type="text" 
                                    placeholder="🔍 Buscar por código, cliente, estado..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)} 
                                    className="w-full p-2 rounded-lg border border-slate-800 bg-slate-950 text-white text-sm mb-4 focus:outline-none focus:border-red-500"
                                />

                                <h3 className="text-lg font-bold mb-4">Historial de Pedidos (Global)</h3>
                                <div className="space-y-2">
                                    {filteredOrders.length === 0 ? <div className="bg-slate-900 p-4 rounded-xl text-slate-500 text-center">No se encontraron pedidos.</div> : (
                                        filteredOrders.map(order => (
                                            <div key={order.id} className={`bg-slate-900 p-3 rounded-lg flex justify-between items-center text-sm border ${order.status === 'Anulado' ? 'border-red-500/50 opacity-60' : 'border-slate-800'}`}>
                                                <div>
                                                    <span className="text-red-400 font-bold mr-2">[{order.code || 'N/A'}]</span>
                                                    <span className="text-white font-bold">{order.client}</span> - {order.items}
                                                    <p className="text-slate-500 text-xs">🕒 {new Date(order.createdAt).toLocaleString()}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-green-400 font-bold">S/ {order.total.toFixed(2)}</p>
                                                    <span className="text-slate-400 text-xs">{order.status}</span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </>
                        )}

                        {tab === 'pagos' && (
                            <div>
                                <h3 className="text-lg font-bold mb-4 text-red-500">Pagos de Comisión de Lili</h3>
                                <div className="space-y-4">
                                    {payments.length === 0 ? <div className="bg-slate-900 p-4 rounded-xl text-slate-500 text-center">No hay pagos registrados.</div> : (
                                        payments.map(pay => (
                                            <div key={pay.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                                <div className="flex items-center gap-4">
                                                    <button onClick={() => setModalReceipt(pay.receipt)} className="bg-slate-800 p-2 rounded-lg text-blue-400 text-xs hover:bg-slate-700">👁️ Ver Comprobante</button>
                                                    <div>
                                                        <p className="text-white text-sm font-bold">Monto Declarado: S/ {Number(pay.amountPaid).toFixed(2)}</p>
                                                        <p className="text-slate-400 text-xs">Fecha: {pay.paymentDate}</p>
                                                        <p className="text-slate-500 text-xs">Ref: {pay.reference || 'Sin referencia'}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3 w-full md:w-auto">
                                                    {pay.status === 'Pendiente' ? (
                                                        <>
                                                            <button onClick={() => approvePayment(pay.id)} className="bg-green-500 text-slate-900 px-4 py-2 rounded font-bold text-sm w-full md:w-auto">Aprobar Pago</button>
                                                            <button onClick={() => rejectPayment(pay.id)} className="bg-red-600 text-white px-4 py-2 rounded font-bold text-sm w-full md:w-auto">Rechazar</button>
                                                        </>
                                                    ) : (
                                                        <span className={`px-4 py-2 rounded-full text-xs font-bold text-center ${pay.status === 'Aprobado' ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}`}>{pay.status}</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === 'config' && (
                            <div className="bg-slate-900 p-4 rounded-xl border border-red-500/30">
                                <h3 className="text-lg font-bold text-white mb-4">Mi Configuración de Cobro (Comisiones)</h3>
                                <form onSubmit={saveSuperadminConfig} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="flex flex-col items-center justify-center bg-slate-950 p-4 rounded-lg">
                                        <img src={editYapeQR || "https://via.placeholder.com/150"} alt="QR Actual" className="w-32 h-32 mb-2 rounded object-cover" />
                                        <label className="text-[10px] text-red-400 cursor-pointer hover:underline mt-1">
                                            Cambiar mi QR de Yape
                                            <input type="file" accept="image/*" onChange={handleSuperadminQRFile} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 block mb-1">Mi Número de Yape</label>
                                            <input type="text" value={editYapeNumber} onChange={(e) => setEditYapeNumber(e.target.value)} placeholder="Ej: 999 111 222" className="w-full p-2 rounded-lg border border-slate-800 bg-slate-950 text-white text-sm" />
                                        </div>
                                        <button type="submit" className="bg-red-500 text-white py-2 rounded-lg font-bold mt-2">Guardar Mi Configuración</button>
                                    </div>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
